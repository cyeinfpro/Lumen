[planner]
max_reverse_depth = 2
exclusive_resources = ["postgres", "redis", "filesystem", "web-build"]
full_mandatory_paths = [
  ".github/workflows/**",
  "apps/api/alembic/**",
  "apps/api/alembic.ini",
  "apps/web/package-lock.json",
  "apps/web/scripts/run-tests.mjs",
  "apps/*/pyproject.toml",
  "image-job/pyproject.toml",
  "image-job/requirements.txt",
  "packages/core/**",
  "packages/*/pyproject.toml",
  "pyproject.toml",
  "scripts/run_test_plan.py",
  "scripts/test-manifest.toml",
  "scripts/test_manifest_lint.py",
  "scripts/test.sh",
  "scripts/test_impact.py",
  "uv.lock",
  "**/conftest.py",
]

[gates.python-ruff]
command = "uv run ruff check {changed_python}"

[gates.backend-architecture]
command = "uv run python scripts/check_architecture.py"

[gates.backend-complexity]
command = "uv run python scripts/check_complexity.py"

[gates.backend-runtime-state]
command = "uv run python scripts/module_runtime_state_audit.py"

[gates.migration-static]
command = "uv run python scripts/lint_alembic_breaking.py {changed_migrations}"

[gates.web-architecture]
command = "cd apps/web && npm run check:architecture"

[gates.web-complexity]
command = "cd apps/web && npm run check:complexity"

[gates.web-typecheck]
command = "cd apps/web && npm run type-check"
resources = ["web-build"]

[gates.web-runner-syntax]
command = "node --check apps/web/scripts/run-tests.mjs"

[[rules]]
name = "test-infrastructure"
paths = [
  "scripts/test-manifest.toml",
  "scripts/test_manifest_lint.py",
  "scripts/test_impact.py",
  "scripts/run_test_plan.py",
  "scripts/test.sh",
  "tests/test_test_manifest_lint.py",
  "tests/test_test_impact.py",
  "tests/test_run_test_plan.py",
  "apps/web/scripts/run-tests.mjs",
  "apps/web/__tests__/run-tests-script.test.mjs",
  "**/conftest.py",
]
commands = [
  "uv run pytest -q tests/test_test_manifest_lint.py tests/test_test_impact.py tests/test_run_test_plan.py",
  "cd apps/web && node --test __tests__/run-tests-script.test.mjs",
]
gates = ["python-ruff", "web-runner-syntax"]
risk = ["test-infrastructure"]
resources = []

[[rules]]
name = "api-images"
paths = ["apps/api/app/images/**"]
commands = [
  "uv run pytest -q apps/api/tests/images/test_artifact_saga.py apps/api/tests/images/test_staged_sweep_budget.py apps/api/tests/images/test_artifact_runtime_regressions.py",
]
gates = [
  "python-ruff",
  "backend-architecture",
  "backend-complexity",
  "backend-runtime-state",
]
risk = ["filesystem"]
resources = ["filesystem"]

[[rules]]
name = "api-canvas-auth"
paths = [
  "apps/api/app/canvas_services/**",
  "apps/api/app/routes/auth.py",
  "apps/api/app/idempotency/**",
]
commands = [
  "uv run pytest -q apps/api/tests/test_canvas_execution_guards.py apps/api/tests/test_canvas_projection_guards.py apps/api/tests/test_canvas_retry_isolation.py apps/api/tests/test_auth_security.py apps/api/tests/test_idempotency_serialization.py",
]
gates = [
  "python-ruff",
  "backend-architecture",
  "backend-complexity",
  "backend-runtime-state",
]
risk = ["postgres"]
resources = ["postgres"]

[[rules]]
name = "api-poster"
paths = [
  "apps/api/app/services/poster_styles/**",
  "apps/api/app/routes/poster_styles.py",
]
