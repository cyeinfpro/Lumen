name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check repository Agent instruction targets
        run: |
          test -r MEMORY.md
          git ls-files --error-unmatch MEMORY.md
      - name: Check version consistency
        run: python3 scripts/version.py check
      - name: Check upload body size config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nginx = Path("deploy/nginx.conf.example").read_text(encoding="utf-8")
          next_config = Path("apps/web/next.config.ts").read_text(encoding="utf-8")
          api_main = Path("apps/api/app/main.py").read_text(encoding="utf-8")
          video_routes = Path("apps/api/app/routes/videos.py").read_text(encoding="utf-8")
          if "client_max_body_size 80m;" not in nginx:
              raise SystemExit("deploy/nginx.conf.example must keep client_max_body_size 80m")
          if 'proxyClientMaxBodySize: "80mb"' not in next_config:
              raise SystemExit("apps/web/next.config.ts must keep proxyClientMaxBodySize 80mb")
          if "_MAX_REQUEST_BYTES = 66 * 1024 * 1024" not in api_main:
              raise SystemExit("apps/api/app/main.py must keep the 66 MiB raw request limit")
          if "_VIDEO_REFERENCE_UPLOAD_MAX_BYTES = 64 * 1024 * 1024" not in video_routes:
              raise SystemExit("apps/api/app/routes/videos.py must keep the 64 MiB video upload limit")
          PY
      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/version.py assert-tag "${GITHUB_REF_NAME}"

  impact-plan:
    runs-on: ubuntu-latest
    outputs:
      comparison_base: ${{ steps.base.outputs.base }}
      full_mandatory: ${{ steps.split.outputs.full_mandatory }}
      backend_has_tests: ${{ steps.split.outputs.backend_has_tests }}
      frontend_has_tests: ${{ steps.split.outputs.frontend_has_tests }}
      web_build_required: ${{ steps.split.outputs.web_build_required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          printf 'base=%s\n' "${base}" >> "${GITHUB_OUTPUT}"
      - name: Lint impact test manifest
        run: python scripts/test_manifest_lint.py
      - name: Build explainable impact plan
        run: |
          python scripts/test_impact.py \
            --base "${{ steps.base.outputs.base }}" \
            --head "${GITHUB_SHA}" \
            --output /tmp/lumen-test-plan.json
      - name: Split backend and frontend test plans
        id: split
        run: |
          jq '
            .commands |= map(
              select(
                .kind == "test"
                and ((.command | startswith("cd apps/web")) | not)
              )
            )
          ' /tmp/lumen-test-plan.json > /tmp/lumen-backend-test-plan.json
          jq '
            .commands |= map(
              select(
                .kind == "test"
                and (.command | startswith("cd apps/web"))
              )
            )
          ' /tmp/lumen-test-plan.json > /tmp/lumen-frontend-test-plan.json
          {
            printf 'full_mandatory=%s\n' \
              "$(jq -r '.full_mandatory' /tmp/lumen-test-plan.json)"
            printf 'backend_has_tests=%s\n' \
              "$(jq -r '.commands | length > 0' /tmp/lumen-backend-test-plan.json)"
            printf 'frontend_has_tests=%s\n' \
              "$(jq -r '.commands | length > 0' /tmp/lumen-frontend-test-plan.json)"
            printf 'web_build_required=%s\n' \
              "$(jq -r '
                any(
                  .changed_files[];
                  test(
                    "^apps/web/(src|public)/"
                    + "|^apps/web/(package(-lock)?\\\\.json"
                    + "|next\\\\.config\\\\.ts|tsconfig\\\\.json"
                    + "|postcss\\\\.config\\\\.mjs|Dockerfile)$"
                  )
                )
              ' /tmp/lumen-test-plan.json)"
          } >> "${GITHUB_OUTPUT}"
      - name: Reject unexplained empty plans
        run: |
          if [[ "$(jq '.commands | length' /tmp/lumen-test-plan.json)" -eq 0 ]] \
            && [[ "$(jq '.changed_files | length' /tmp/lumen-test-plan.json)" -gt 0 ]] \
            && [[ "$(jq '.unmatched_changed_files | length' /tmp/lumen-test-plan.json)" -eq 0 ]]; then
            echo "impact plan selected no commands without unmatched-file evidence" >&2
            exit 1
          fi
      - name: Upload impact plans
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-impact-plan
          path: |
            /tmp/lumen-test-plan.json
            /tmp/lumen-backend-test-plan.json
            /tmp/lumen-frontend-test-plan.json

  backend:
    needs: [version, impact-plan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumen_test
          POSTGRES_PASSWORD: lumen_test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen_test -d lumen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUMEN_TEST_POSTGRES_URL: postgresql+asyncpg://lumen_test:lumen_test@127.0.0.1:5432/lumen_test
      LUMEN_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Install dependencies
        # virtual workspace root → 必须 --all-packages 才会装所有 member（api/worker/tgbot/core）的依赖
        run: uv sync --all-packages
      - name: Python Ruff gate
        run: uv run ruff check packages/core apps/api apps/worker apps/tgbot image-job tests
      # 治理门禁独立成 step，先 fail-fast 并保留清晰日志。GitHub 分支保护
      # 仍以 backend job 为 required check；step 本身不能单独设为 required。
      # scripts/test.sh 本地默认仍运行同样门禁，CI 则通过环境变量避免重复。
      - name: Architecture budget gate
        run: uv run python scripts/check_architecture.py
      - name: Compatibility facade inventory gate
        run: uv run python scripts/facade_inventory.py
      - name: Dead-code retirement gate
        run: uv run python scripts/dead_code_audit.py
      - name: Complexity budget gate
        run: uv run python scripts/check_complexity.py
      - name: Module runtime state gate
        run: uv run python scripts/module_runtime_state_audit.py
      - name: Governance baseline monotonicity gate
        env:
          GOVERNANCE_BASE_SHA: ${{ needs.impact-plan.outputs.comparison_base }}
        run: uv run python scripts/baseline_monotonic.py
      - name: Alembic linter regression tests
        run: uv run pytest -q tests/test_lint_alembic_breaking.py
      - name: Alembic breaking migration gate
        env:
          MIGRATION_BASE: ${{ needs.impact-plan.outputs.comparison_base }}
          MIGRATION_HEAD: ${{ github.sha }}
        run: >-
          uv run python scripts/lint_alembic_breaking.py
          --base "${MIGRATION_BASE}"
          --head "${MIGRATION_HEAD}"
      - name: Download impact plan
        if: github.event_name == 'pull_request' && needs.impact-plan.outputs.full_mandatory != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lumen-impact-plan
          path: /tmp/lumen-impact-plan
      - name: Run impacted backend tests
        if: >-
          github.event_name == 'pull_request'
          && needs.impact-plan.outputs.full_mandatory != 'true'
          && needs.impact-plan.outputs.backend_has_tests == 'true'
        run: >-
          uv run python scripts/run_test_plan.py
          /tmp/lumen-impact-plan/lumen-backend-test-plan.json
          --results /tmp/lumen-backend-test-results.json
          --max-jobs 4
      - name: Run full backend tests (worker / api / core)
        if: github.event_name != 'pull_request' || needs.impact-plan.outputs.full_mandatory == 'true'
        env:
          LUMEN_TEST_SKIP_GOVERNANCE: "1"
          LUMEN_TEST_SKIP_WEB: "1"
          LUMEN_TEST_SKIP_AGENT_RUNTIME: "1"
        run: bash scripts/test.sh

  agent-runtime:
    needs: [version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-runtime
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.0'
          cache: 'npm'
          cache-dependency-path: apps/agent-runtime/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Reject vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

  frontend:
    needs: [version, impact-plan]
    runs-on: ubuntu-latest
    env:
      WEB_GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Chromium for Agent browser tests
        run: npx playwright install --with-deps chromium
      - name: Reject vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Download impact plan
        if: github.event_name == 'pull_request' && needs.impact-plan.outputs.full_mandatory != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lumen-impact-plan
          path: /tmp/lumen-impact-plan
      - name: Run impacted frontend tests
        if: >-
          github.event_name == 'pull_request'
          && needs.impact-plan.outputs.full_mandatory != 'true'
          && needs.impact-plan.outputs.frontend_has_tests == 'true'
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/run_test_plan.py
          /tmp/lumen-impact-plan/lumen-frontend-test-plan.json
          --results /tmp/lumen-frontend-test-results.json
          --max-jobs 4
      - name: Run full frontend tests
        if: github.event_name != 'pull_request' || needs.impact-plan.outputs.full_mandatory == 'true'
        run: npm test
      - name: Run Agent browser workflows
        if: github.event_name != 'pull_request' || needs.impact-plan.outputs.full_mandatory == 'true'
        run: npm run test:e2e
      - name: Audit interactive hit areas
        run: node scripts/audit-hit-area.mjs
      - run: npm run lint
      - run: npm run type-check
      - name: Build (smoke test)
        if: >-
          github.event_name != 'pull_request'
          || needs.impact-plan.outputs.full_mandatory == 'true'
          || needs.impact-plan.outputs.web_build_required == 'true'
        env:
          LUMEN_BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_BASE: /api
        run: npm run build
      - name: Setup Node 24 compatibility gate
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Verify semantic idempotency on Node 24
        run: npm test -- src/lib/api/semanticIdempotency.test.ts
