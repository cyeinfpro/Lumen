# Lumen full-stack runtime entrypoint (postgres + redis + api + worker + web + tgbot/migrate/bootstrap).
# Production images are complete name@sha256 references. LUMEN_IMAGE_TAG remains
# update-channel metadata only and never selects a runtime image.
# agent-runtime uses a compatibility profile so four-image updaters can parse
# this file during the closed-by-default transition. Current install/update
# scripts always target it explicitly, making it an always-running core service.
# tgbot / migrate / bootstrap remain optional profiles.

x-service-hardening: &service-hardening
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ulimits:
    nofile:
      soft: ${LUMEN_ULIMIT_NOFILE_SOFT:-65536}
      hard: ${LUMEN_ULIMIT_NOFILE_HARD:-65536}
    nproc: ${LUMEN_ULIMIT_NPROC:-4096}
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-redis-url-env: &redis-url-env
  REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0}"

x-app-runtime-env: &app-runtime-env
  <<: *redis-url-env
  DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:?Set DB_NAME in .env}}"
  SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
  IMAGE_PROXY_SECRET: "${IMAGE_PROXY_SECRET:?Set IMAGE_PROXY_SECRET in .env}"
  BYOK_API_KEY_MASTER_SECRET: "${BYOK_API_KEY_MASTER_SECRET:?Set BYOK_API_KEY_MASTER_SECRET in .env}"
  AGENT_RUNTIME_MAX_REQUEST_BYTES: "${AGENT_RUNTIME_MAX_REQUEST_BYTES:-16777216}"
  AGENT_RUNTIME_MAX_LINE_BYTES: "${AGENT_RUNTIME_MAX_LINE_BYTES:-65536}"

services:
  postgres:
    <<: *service-hardening
    # pgvector/pgvector:pg16 = postgres:16 (Debian) + pgvector ext 预装.
    # account memory 0018 migration 需要 vector extension; alpine 镜像没装.
    # 镜像内 postgres uid=999 (Debian default), 与之前 alpine 的 uid=70 不同,
    # update.sh 升级路径会自动 chown 数据目录 (70 → 999).
    image: ${LUMEN_POSTGRES_IMAGE_REF:?Set LUMEN_POSTGRES_IMAGE_REF to name@sha256 digest}
    container_name: lumen-pg
    user: "${LUMEN_POSTGRES_UID:-999}:${LUMEN_POSTGRES_GID:-999}"
    restart: unless-stopped
    shm_size: "256m"
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: "${DB_USER:?Set DB_USER in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      POSTGRES_DB: "${DB_NAME:?Set DB_NAME in .env}"
    cpus: "1.0"
    mem_limit: 1g
    # 不映射到 host：api/worker/tgbot 走 lumen_backend network 即可。
    # 调试用 `docker exec lumen-pg psql ...`；外部 GUI 工具按需 ssh -L 隧道。
    volumes:
      - type: bind
        source: ${LUMEN_DB_ROOT:-/opt/lumendata}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - lumen_backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:?Set DB_USER in .env}", "-d", "${DB_NAME:?Set DB_NAME in .env}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *service-hardening
    image: ${LUMEN_REDIS_IMAGE_REF:?Set LUMEN_REDIS_IMAGE_REF to name@sha256 digest}
    container_name: lumen-redis
    user: "${LUMEN_REDIS_UID:-999}:${LUMEN_REDIS_GID:-999}"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    cpus: "0.5"
    mem_limit: 512m
    # 不映射到 host：调试用 `docker exec lumen-redis redis-cli`。
    entrypoint: ["/bin/sh", "/usr/local/bin/lumen-redis-entrypoint"]
    volumes:
      - type: bind
        source: ${LUMEN_DB_ROOT:-/opt/lumendata}/redis
        target: /data
        bind:
          create_host_path: false
      - ./deploy/redis/redis-entrypoint.sh:/usr/local/bin/lumen-redis-entrypoint:ro
    networks:
      - lumen_backend
    healthcheck:
      # REDIS_PASSWORD 用普通展开：`${VAR:?msg}` 是 shell 强制语法，空字符串
      # 或未导出都会让 healthcheck 永远 fail。fail-fast 留给 entrypoint
      # （deploy/redis/redis-entrypoint.sh）和 compose 顶部 redis-url-env 处理。
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli --no-auth-warning --raw ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *service-hardening
    image: ${LUMEN_API_IMAGE_REF:?Set LUMEN_API_IMAGE_REF to name@sha256 digest}
    container_name: lumen-api
    labels:
      lumen.color: "blue"
    working_dir: /app/apps/api
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "${LUMEN_API_WORKERS:-2}"
      - "--limit-max-requests"
      - "${LUMEN_API_LIMIT_MAX_REQUESTS:-10000}"
      - "--limit-max-requests-jitter"
      - "${LUMEN_API_LIMIT_MAX_REQUESTS_JITTER:-1000}"
      - "--timeout-keep-alive"
      - "${LUMEN_API_TIMEOUT_KEEP_ALIVE:-60}"
      - "--timeout-graceful-shutdown"
      - "${LUMEN_API_TIMEOUT_GRACEFUL_SHUTDOWN:-30}"
      - "--timeout-worker-healthcheck"
      - "${LUMEN_API_TIMEOUT_WORKER_HEALTHCHECK:-10}"
    user: "${LUMEN_APP_UID:-10001}:${LUMEN_APP_GID:-10001}"
    group_add:
      - "${LUMEN_APP_STORAGE_GID:-10001}"
      - "${LUMEN_BACKUP_SERVICE_GID:-10002}"
    env_file: ${LUMEN_COMPOSE_ENV_FILE:-.env}
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: "1.5"
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_BIND_PORT:-8000}:8000"
    environment:
      <<: *app-runtime-env
      LUMEN_API_WORKERS: "${LUMEN_API_WORKERS:-2}"
      # 容器化部署下让 admin_update 走 path-unit 触发，跳过容器内 systemctl 探测。
      # 触发文件由 lumen-api 写到挂载的 backup 目录，宿主机 PID 1 监听并启动
      # lumen-update-runner.service 真正执行 update.sh。
      LUMEN_UPDATE_VIA_TRIGGER: "1"
      # Manual backup follows the same host-side trigger model: the container
      # writes .backup.trigger, PID 1 runs lumen-backup.service with Docker CLI.
      LUMEN_BACKUP_VIA_TRIGGER: "1"
      # Restore must also run on the host because the API container has neither
      # the Docker CLI nor the socket needed by restore.sh.
      LUMEN_RESTORE_VIA_TRIGGER: "1"
      # Telegram SSH proxies terminate inside lumen-api. Bind on the container
      # network and advertise the Compose service name to the separate tgbot
      # container. The dynamic SOCKS port is intentionally not published.
      TELEGRAM_PROXY_BIND_HOST: "${TELEGRAM_PROXY_BIND_HOST:-0.0.0.0}"
      TELEGRAM_PROXY_ADVERTISE_HOST: "${TELEGRAM_PROXY_ADVERTISE_HOST:-api}"
    volumes:
      - type: bind
        source: ${LUMEN_DATA_ROOT:-/opt/lumendata}/storage
        target: /opt/lumendata/storage
        bind:
          create_host_path: false
      - type: bind
        source: ${LUMEN_DATA_ROOT:-/opt/lumendata}/backup
        target: /opt/lumendata/backup
        bind:
          create_host_path: false
      # admin_update / admin_backups 用 _discover_scripts_dir() 定位 update/backup
      # 脚本，做 preflight 校验。镜像里不打包 scripts/，由 release 目录挂载提供。
      - ./scripts:/app/scripts:ro
      # admin_update 需要读取宿主 release 元数据，避免容器内误判为 0.0.0/unknown。
      - ${LUMEN_UPDATE_ROOT:-/opt/lumen}:/opt/lumen:ro
      # admin_storage 与 host 上的 lumen-storage-{mount,apply,test} 单元用这个目录
      # 双向通信：API 写 storage.conf / apply.trigger，host 写 status.json / last-*.json。
      # 此目录不在 /opt/lumendata 上，所以 SMB 切换时不会被卸载，避免鸡生蛋。
      - type: bind
        source: /var/lib/lumen-storage
        target: /var/lib/lumen-storage
        bind:
          create_host_path: false
    networks:
      - lumen_backend
    healthcheck:
      # Keep /healthz as container liveness only. Install/update/rollback and
      # backup/restore transaction commits require API /readyz plus the Worker
      # module health check.
      # 用 stdlib urllib 做健康探测：镜像内不一定装了 curl/wget，依赖外部
      # 二进制会让 worker 的 depends_on: service_healthy 永远阻塞。
      # python 始终在镜像里（runtime 本体），最稳。
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read(); sys.exit(0)\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *service-hardening
    image: ${LUMEN_WORKER_IMAGE_REF:?Set LUMEN_WORKER_IMAGE_REF to name@sha256 digest}
    container_name: lumen-worker
    working_dir: /app/apps/worker
    command: ["python", "-m", "app.worker_health", "run"]
    user: "${LUMEN_APP_UID:-10001}:${LUMEN_APP_GID:-10001}"
    group_add:
      - "${LUMEN_APP_STORAGE_GID:-10001}"
    env_file: ${LUMEN_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *app-runtime-env
      IMAGE_JOB_SIDECAR_TOKEN: "${IMAGE_JOB_SIDECAR_TOKEN:-}"
      LUMEN_WORKER_HEALTH_INTERVAL: "${LUMEN_WORKER_HEALTH_INTERVAL:-30}"
      LUMEN_WORKER_HEALTH_KEY_PREFIX: "${LUMEN_WORKER_HEALTH_KEY_PREFIX:-arq:queue:health-check}"
      LUMEN_WORKER_HEALTH_STATE_FILE: "${LUMEN_WORKER_HEALTH_STATE_FILE:-/tmp/lumen-worker-health.json}"
    restart: unless-stopped
    stop_signal: SIGTERM
    # 4K long task envelope: arq 1800s task timeout + 30s buffer; do not shorten (see §8.5).
    stop_grace_period: 1830s
    cpus: "2.0"
    mem_limit: 3g
    # Prometheus metrics 端口 — 默认绑 127.0.0.1，宿主上的 prom 才能抓；docker network 内
    # 仍可用 worker:9100 直连。WORKER_METRICS_BIND 留口子，需要外部 prom 时改 0.0.0.0。
    ports:
      - "${WORKER_METRICS_BIND:-127.0.0.1}:9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${LUMEN_DATA_ROOT:-/opt/lumendata}/storage
        target: /opt/lumendata/storage
        bind:
          create_host_path: false
    networks:
      - lumen_backend
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  agent-runtime:
    <<: *service-hardening
    # The API-image fallback is never started by current scripts. It only lets
    # legacy four-image updaters enumerate an immutable target image set without
    # learning a fifth manifest key; modern preflight requires and overrides
    # LUMEN_AGENT_RUNTIME_IMAGE_REF before activating this profile.
    image: ${LUMEN_AGENT_RUNTIME_IMAGE_REF:-${LUMEN_API_IMAGE_REF:?Set LUMEN_API_IMAGE_REF to name@sha256 digest}}
    container_name: lumen-agent-runtime
    user: "${LUMEN_AGENT_RUNTIME_UID:-1000}:${LUMEN_AGENT_RUNTIME_GID:-1000}"
    profiles: ["agent-runtime"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${AGENT_RUNTIME_TMPFS_SIZE:-64m},uid=${LUMEN_AGENT_RUNTIME_UID:-1000},gid=${LUMEN_AGENT_RUNTIME_GID:-1000},mode=1777
    cpus: "${AGENT_RUNTIME_CPUS:-0.75}"
    mem_limit: ${AGENT_RUNTIME_MEMORY_LIMIT:-768m}
    environment:
      NODE_ENV: "production"
      AGENT_RUNTIME_HOST: "0.0.0.0"
      AGENT_RUNTIME_PORT: "8090"
      AGENT_RUNTIME_SHARED_SECRET: "${AGENT_RUNTIME_SHARED_SECRET:-}"
      AGENT_RUNTIME_AUTH_CLOCK_SKEW_SECONDS: "${AGENT_RUNTIME_AUTH_CLOCK_SKEW_SECONDS:-30}"
      AGENT_RUNTIME_NONCE_TTL_SECONDS: "${AGENT_RUNTIME_NONCE_TTL_SECONDS:-120}"
      AGENT_RUNTIME_NONCE_CACHE_SIZE: "${AGENT_RUNTIME_NONCE_CACHE_SIZE:-10000}"
      AGENT_RUNTIME_MAX_REQUEST_BYTES: "${AGENT_RUNTIME_MAX_REQUEST_BYTES:-16777216}"
      AGENT_RUNTIME_MAX_LINE_BYTES: "${AGENT_RUNTIME_MAX_LINE_BYTES:-65536}"
      AGENT_RUNTIME_MAX_CONCURRENT_RUNS: "${AGENT_RUNTIME_MAX_CONCURRENT_RUNS:-8}"
      AGENT_RUNTIME_MAX_CONCURRENT_BODY_READS: "${AGENT_RUNTIME_MAX_CONCURRENT_BODY_READS:-16}"
      AGENT_RUNTIME_MAX_INFLIGHT_REQUEST_BYTES: "${AGENT_RUNTIME_MAX_INFLIGHT_REQUEST_BYTES:-67108864}"
      AGENT_RUNTIME_REQUEST_BODY_TIMEOUT_SECONDS: "${AGENT_RUNTIME_REQUEST_BODY_TIMEOUT_SECONDS:-10}"
      AGENT_RUNTIME_HEARTBEAT_INTERVAL_SECONDS: "${AGENT_RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-15}"
      AGENT_RUNTIME_TOOL_GATEWAY_TIMEOUT_SECONDS: "${AGENT_RUNTIME_TOOL_GATEWAY_TIMEOUT_SECONDS:-30}"
      AGENT_RUNTIME_TOOL_GATEWAY_MAX_RESPONSE_BYTES: "${AGENT_RUNTIME_TOOL_GATEWAY_MAX_RESPONSE_BYTES:-65536}"
      AGENT_RUNTIME_MAX_RUN_SECONDS: "${AGENT_RUNTIME_MAX_RUN_SECONDS:-21600}"
      AGENT_RUNTIME_MAX_PROVIDER_DISPATCHES: "${AGENT_RUNTIME_MAX_PROVIDER_DISPATCHES:-128}"
      AGENT_RUNTIME_MAX_TURNS: "${AGENT_RUNTIME_MAX_TURNS:-128}"
      AGENT_RUNTIME_MAX_TOTAL_TOKENS: "${AGENT_RUNTIME_MAX_TOTAL_TOKENS:-4000000}"
      AGENT_RUNTIME_MAX_EVENT_BYTES: "${AGENT_RUNTIME_MAX_EVENT_BYTES:-16777216}"
      AGENT_RUNTIME_MAX_REPEATED_TOOL_CALLS: "${AGENT_RUNTIME_MAX_REPEATED_TOOL_CALLS:-8}"
      AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS: "${AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS:-20}"
    networks:
      - lumen_backend
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    <<: *service-hardening
    image: ${LUMEN_WEB_IMAGE_REF:?Set LUMEN_WEB_IMAGE_REF to name@sha256 digest}
    container_name: lumen-web
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "1.0"
    mem_limit: 1g
    environment:
      LUMEN_BACKEND_URL: "http://api:8000"
      NEXT_PUBLIC_API_BASE: "/api"
      NODE_ENV: "production"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:3000:3000"
    networks:
      - lumen_backend
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"const req = require('http').request({ host: '127.0.0.1', port: 3000, path: '/healthz', method: 'HEAD' }, (r) => { process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(5000, function () { this.destroy(); process.exit(1); }); req.end();\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  tgbot:
    <<: *service-hardening
    image: ${LUMEN_TGBOT_IMAGE_REF:?Set LUMEN_TGBOT_IMAGE_REF to name@sha256 digest}
    container_name: lumen-tgbot
    working_dir: /app/apps/tgbot
    command: ["python", "-m", "app.main"]
    # 与 api/worker 一致：先 env_file 读 .env，environment 块再覆盖关键变量。
    # 没 env_file 会让 tgbot 漏掉 admin / DB / observability 等共用配置。
    env_file: ${LUMEN_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *redis-url-env
      # tgbot 容器要走 docker network 调 lumen-api，不能用 config.py 里的
      # 127.0.0.1:8000 默认值（那指向 tgbot 容器自己的 loopback）。
      LUMEN_API_BASE: "http://api:8000"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_BOT_SHARED_SECRET: "${TELEGRAM_BOT_SHARED_SECRET:-}"
      TELEGRAM_PROXY_URL: "${TELEGRAM_PROXY_URL:-}"
      DOWNLOAD_TMP_DIR: "${DOWNLOAD_TMP_DIR:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TELEGRAM_ALLOWED_USER_IDS: "${TELEGRAM_ALLOWED_USER_IDS:-}"
      TGBOT_HEALTH_STATE_FILE: "${TGBOT_HEALTH_STATE_FILE:-/tmp/lumen-tgbot-health.json}"
      TGBOT_HEALTH_HEARTBEAT_INTERVAL_SECONDS: "${TGBOT_HEALTH_HEARTBEAT_INTERVAL_SECONDS:-5}"
      TGBOT_HEALTH_MAX_AGE_SECONDS: "${TGBOT_HEALTH_MAX_AGE_SECONDS:-20}"
      TGBOT_HEALTH_READY_STABILITY_SECONDS: "${TGBOT_HEALTH_READY_STABILITY_SECONDS:-5}"
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "0.5"
    mem_limit: 512m
    profiles: ["tgbot"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - lumen_backend
    healthcheck:
      test: ["CMD", "python", "-m", "app.tgbot_health", "check"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    <<: *service-hardening
    image: ${LUMEN_API_IMAGE_REF:?Set LUMEN_API_IMAGE_REF to name@sha256 digest}
    working_dir: /app/apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-runtime-env
      APP_ENV: "${APP_ENV:-dev}"
      TELEGRAM_BOT_SHARED_SECRET: "${TELEGRAM_BOT_SHARED_SECRET:-}"
    restart: "no"
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lumen_backend

  bootstrap:
    <<: *service-hardening
    image: ${LUMEN_API_IMAGE_REF:?Set LUMEN_API_IMAGE_REF to name@sha256 digest}
    working_dir: /app/apps/api
    command:
      - "/bin/sh"
      - "-ec"
      - |
        : "$${LUMEN_ADMIN_EMAIL:?Set LUMEN_ADMIN_EMAIL when running bootstrap profile}"
        : "$${LUMEN_ADMIN_PASSWORD:?Set LUMEN_ADMIN_PASSWORD when running bootstrap profile}"
        exec python -m app.scripts.bootstrap
    environment:
      <<: *app-runtime-env
      APP_ENV: "${APP_ENV:-dev}"
      TELEGRAM_BOT_SHARED_SECRET: "${TELEGRAM_BOT_SHARED_SECRET:-}"
      LUMEN_ADMIN_EMAIL: "${LUMEN_ADMIN_EMAIL:-}"
      LUMEN_ADMIN_PASSWORD: "${LUMEN_ADMIN_PASSWORD:-}"
    restart: "no"
    profiles: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lumen_backend

networks:
  lumen_backend:
    driver: bridge
