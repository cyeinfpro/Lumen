[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-image-job"
version = "1.2.78"
description = "Lumen isolated image-job sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0,<47.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pillow>=10.3,<13.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["image_job"]
